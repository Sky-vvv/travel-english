<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅行英语口袋本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: airport wayfinding — navy ink, signage-yellow markers, one column of phrase cards, bottom tab bar */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#e3e9f0; --fg:#0f1b2d; --muted:#556274;
  --line:#d3dbe4; --sign:#ffc72c; --sign-ink:#0f1b2d; --accent:#1f5fae; --ok:#1d7f4e; --ok-bg:#dff3e7;
  --warn-bg:#fff2c9; --danger:#c0362c;
  --f-display:"Barlow Condensed","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-en:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Noto Sans","Lucida Sans Unicode","Arial Unicode MS",sans-serif;
  --f-zh:-apple-system,"PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1320; --surface:#142035; --surface-2:#1c2a42; --fg:#e7edf5; --muted:#9aa8bb;
  --line:#2a3a54; --sign:#ffc72c; --sign-ink:#0f1b2d; --accent:#7fb2ff; --ok:#5fd394; --ok-bg:#163828;
  --warn-bg:#3a3215; --danger:#ff7b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1320; --surface:#142035; --surface-2:#1c2a42; --fg:#e7edf5; --muted:#9aa8bb;
  --line:#2a3a54; --sign:#ffc72c; --sign-ink:#0f1b2d; --accent:#7fb2ff; --ok:#5fd394; --ok-bg:#163828;
  --warn-bg:#3a3215; --danger:#ff7b70; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-zh);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
.top{display:flex;align-items:center;gap:12px;padding-block:8px 14px}
.logo{width:40px;height:40px;border-radius:8px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
h1{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted);font-weight:600}

.summary{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:14px}
.summary .big{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.summary .big small{font-size:20px;opacity:.7}
.summary p{margin:0;font-size:14px;opacity:.85}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.summary .bar{background:rgba(127,127,127,.35);margin-top:8px}
.bar i{display:block;height:100%;background:var(--sign);border-radius:3px}

.search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tile .row{display:flex;align-items:center;gap:10px}
.ico{width:36px;height:36px;border-radius:8px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:17px}
.tile .en{font-family:var(--f-display);font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tile .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:6px 0;color:var(--accent);font-size:15px}
.scene-head{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.scene-head .ico{width:48px;height:48px}.scene-head .ico svg{width:28px;height:28px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card.known{border-color:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--fg);margin-bottom:6px}
.en-text{font-family:var(--f-en);font-size:20px;font-weight:700;line-height:1.3;margin:0;background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.ipa{font-family:var(--f-ipa);color:var(--accent);font-size:15px;margin:4px 0 2px;word-break:break-word}
.zh{font-size:16px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-size:14px;min-height:38px}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:700}
.btn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.btn.star.on{background:var(--warn-bg);border-color:var(--sign);color:var(--fg)}
.btn.wide{flex:1;justify-content:center;border-radius:10px;min-height:48px;font-size:16px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px 8px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mode{display:flex;flex-direction:column;gap:8px}
.mode button{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px}
.mode button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--surface)}
.mode small{display:block;color:var(--muted);font-size:13px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
.check input{width:20px;height:20px}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;min-height:280px;display:flex;flex-direction:column;gap:14px}
.quiz .count{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.prompt-zh{font-size:24px;font-weight:700;text-align:center;margin:18px 0 6px}
.reveal{border-top:1px dashed var(--line);padding-top:14px;text-align:center}
.reveal .en-text{text-align:center;font-size:22px}
.listen-btn{align-self:center;width:88px;height:88px;border-radius:50%;background:var(--sign);color:var(--sign-ink);border:0;display:grid;place-items:center;margin:10px 0}
.listen-btn svg{width:40px;height:40px;fill:currentColor}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px;font-size:16px}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--danger);color:var(--danger)}
.row2{display:flex;gap:10px}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--f-display);font-size:56px;line-height:1}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;flex-wrap:wrap}
.set-row select,.set-row input[type=range]{font-size:15px}
.danger-link{background:none;border:0;color:var(--danger);padding:8px 0;font-size:14px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{flex:1;max-width:200px;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--fg);font-weight:700}
.nav button[aria-current="page"] svg{stroke:var(--accent)}

.show{position:fixed;inset:0;background:var(--sign);color:var(--sign-ink);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));gap:18px;text-align:center}
.show .huge{font-family:var(--f-en);font-weight:700;font-size:clamp(30px,9vw,56px);line-height:1.2;overflow-wrap:anywhere}
.show .small{font-size:18px;opacity:.75}
.show .hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;font-size:13px;opacity:.6}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.quiz{transition:border-color .2s}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="nav" id="nav">
  <button data-tab="learn" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21h15"/></svg>学习</button>
  <button data-tab="practice"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>练习</button>
  <button data-tab="mine"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>收藏与设置</button>
</nav>
<div class="show" id="show" hidden role="dialog" aria-label="给对方看"></div>
<div class="toast" id="toast" hidden></div>

const ALL=[];

const SCENE_BY_ID=Object.fromEntries(SCENES.map(s=>[s.id,s]));

const KEY='travel-english-v1';
let S={known:{},star:{},accent:'en-US',rate:0.9};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SPEAKER='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800);}

// ---------- speech ----------
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){
  if(!voices.length)loadVoices();
  const want=S.accent.toLowerCase();
  const m=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===want);
  const good=m.find(v=>/samantha|daniel|google|natural|enhanced|premium/i.test(v.name));
  return good||m[0]||voices.find(v=>/^en/i.test(v.lang))||null;
}
function speak(text,slow){
  if(!('speechSynthesis' in window)){toast('这个浏览器不支持朗读，请换 Safari 或 Chrome');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=S.accent;const v=pickVoice();if(v)u.voice=v;
    u.rate=slow?0.6:S.rate;
    speechSynthesis.speak(u);
  }catch(e){toast('朗读失败，请检查手机是否静音');}
}

// ---------- routing ----------
let tab='learn',view={name:'home'},query='';
function go(t,v){tab=t;view=v||{name:t==='learn'?'home':t};render();window.scrollTo(0,0);}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='practice'&&view.name==='quiz'){}go(b.dataset.tab);});

function sceneStats(id){const items=ALL.filter(x=>x.scene===id);return{total:items.length,known:items.filter(x=>S.known[x.id]).length};}

function phraseCard(x,showScene){
  const k=!!S.known[x.id],st=!!S.star[x.id];
  return `<div class="card${k?' known':''}" data-id="${x.id}">
    ${x.heard?'<span class="tag">对方常说 · 重点听懂</span>':''}
    ${showScene?`<div class="eyebrow">${esc(SCENE_BY_ID[x.scene].zh)}</div>`:''}
    <button class="en-text" data-act="play" aria-label="朗读 ${esc(x.en)}">${esc(x.en)}</button>
    <div class="ipa">/${esc(x.ipa)}/</div>
    <p class="zh">${esc(x.zh)}</p>
    <div class="actions">
      <button class="btn play" data-act="play">${PLAY}朗读</button>
      <button class="btn" data-act="slow">慢速</button>
      ${x.heard?'':'<button class="btn" data-act="show">给对方看</button>'}
      <button class="btn${k?' on':''}" data-act="known" aria-pressed="${k}">${k?'✓ 已会':'标为已会'}</button>
      <button class="btn star${st?' on':''}" data-act="star" aria-pressed="${st}" aria-label="收藏">${st?'★':'☆'}</button>
    </div></div>`;
}

function renderHome(){
  const total=ALL.length,known=ALL.filter(x=>S.known[x.id]).length;
  const q=query.trim().toLowerCase();
  let body;
  if(q){
    const hits=ALL.filter(x=>x.en.toLowerCase().includes(q)||x.zh.includes(q));
    body=hits.length?`<div class="list">${hits.map(x=>phraseCard(x,true)).join('')}</div>`:`<p class="empty">没有找到“${esc(query)}”，试试别的词，比如“厕所”或“taxi”。</p>`;
  }else{
    body=`<div class="grid">${SCENES.map(s=>{const st=sceneStats(s.id);return `<button class="tile" data-scene="${s.id}">
      <span class="row"><span class="ico">${svgIcon(s.id)}</span><span style="min-width:0"><b>${s.zh}</b><br><span class="en">${s.en}</span></span></span>
      <span class="bar"><i style="width:${st.known/st.total*100}%"></i></span>
      <span class="meta">已会 ${st.known} / ${st.total} 句</span></button>`}).join('')}</div>`;
  }
  return `<header class="top"><span class="logo">${svgIcon('airport').replace('<svg','<svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"')}</span>
    <div><h1>旅行英语口袋本</h1><p class="sub">按场景学 · 每句都有音标和发音</p></div></header>
    <section class="summary"><div class="big">${known}<small> / ${total}</small></div>
      <div style="flex:1;min-width:0"><p>已经会说的句子</p><div class="bar"><i style="width:${known/total*100}%"></i></div></div></section>
    <input class="search" id="q" type="search" placeholder="搜索：中文或英文，例如 厕所 / taxi" value="${esc(query)}" aria-label="搜索句子">
    ${body}`;
}

function renderScene(id){
  const s=SCENE_BY_ID[id],st=sceneStats(id);
  const items=ALL.filter(x=>x.scene===id);
  return `<button class="back" data-back>‹ 全部场景</button>
    <div class="scene-head"><span class="ico">${svgIcon(id)}</span><div><div class="eyebrow">${s.en}</div><h2>${s.zh}</h2></div>
    <span style="margin-left:auto" class="sub">已会 ${st.known}/${st.total}</span></div>
    <div class="list">${items.map(x=>phraseCard(x)).join('')}</div>
    <div class="actions" style="margin-top:16px"><button class="btn wide primary" data-practice="${id}">练习这个场景</button></div>`;
}

// ---------- practice ----------
let P={scope:'all',mode:'say',onlyNew:true};
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pool(){let items=ALL.filter(x=>P.scope==='all'||x.scene===P.scope);if(P.onlyNew){const n=items.filter(x=>!S.known[x.id]);if(n.length)items=n;}return items;}

function renderPracticeSetup(){
  const n=pool().length;
  return `<header class="top"><div><h1>练习</h1><p class="sub">每次 10 句，练完自动记住进度</p></div></header>
  <div class="panel"><h3>练哪个场景</h3><div class="chips">
    <button class="chip" data-scope="all" aria-pressed="${P.scope==='all'}">全部</button>
    ${SCENES.map(s=>`<button class="chip" data-scope="${s.id}" aria-pressed="${P.scope===s.id}">${s.zh}</button>`).join('')}
  </div>
  <label class="check"><input type="checkbox" id="onlyNew" ${P.onlyNew?'checked':''}>只练还没学会的句子</label></div>
  <div class="panel"><h3>练习方式</h3><div class="mode">
    <button data-mode="say" aria-pressed="${P.mode==='say'}"><b>看中文，说英文</b><small>先自己开口说，再看答案、听发音</small></button>
    <button data-mode="listen" aria-pressed="${P.mode==='listen'}"><b>听英文，选意思</b><small>练耳朵：听懂外国人在说什么</small></button>
  </div></div>
  <button class="btn wide primary" id="start" style="width:100%">开始练习（可练 ${n} 句）</button>`;
}

function startQuiz(){
  const items=shuffle(pool()).slice(0,10);
  Q={items,i:0,right:0,revealed:false,picked:null,opts:null,mode:P.mode};
  view={name:'quiz'};prepQ();render();window.scrollTo(0,0);
}
function prepQ(){
  Q.revealed=false;Q.picked=null;Q.opts=null;
  const x=Q.items[Q.i];
  if(Q.mode==='listen'){
    const same=shuffle(ALL.filter(y=>y.scene===x.scene&&y.id!==x.id&&y.zh!==x.zh));
    const other=shuffle(ALL.filter(y=>y.scene!==x.scene));
    const d=same.slice(0,2).concat(other.slice(0,3)).slice(0,3);
    Q.opts=shuffle([x].concat(d));
    speak(x.en);
  }
}
function renderQuiz(){
  const x=Q.items[Q.i];
  const head=`<button class="back" data-quit>‹ 结束练习</button>`;
  const count=`<div class="count"><span>${SCENE_BY_ID[x.scene].zh}</span><span>${Q.i+1} / ${Q.items.length}</span></div>`;
  if(Q.mode==='say'){
    return `${head}<div class="quiz">${count}
      <p class="sub" style="text-align:center;margin:0">用英文怎么说？先试着说出来</p>
      <div class="prompt-zh">${esc(x.zh)}</div>
      ${Q.revealed?`<div class="reveal"><button class="en-text" data-say="${x.id}">${esc(x.en)}</button><div class="ipa">/${esc(x.ipa)}/</div>
        <div class="actions" style="justify-content:center"><button class="btn play" data-say="${x.id}">${PLAY}再听一次</button><button class="btn" data-sayslow="${x.id}">慢速</button></div></div>
        <div class="row2"><button class="btn wide" data-grade="0">还不会</button><button class="btn wide primary" data-grade="1">我说对了</button></div>`
      :`<button class="btn wide primary" id="reveal" style="margin-top:auto">看答案并听发音</button>`}
    </div>`;
  }
  return `${head}<div class="quiz">${count}
    <p class="sub" style="text-align:center;margin:0">听一听，这句话是什么意思？</p>
    <button class="listen-btn" data-say="${x.id}" aria-label="再听一次">${SPEAKER}</button>
    <div class="actions" style="justify-content:center;margin:0"><button class="btn" data-sayslow="${x.id}">慢速再听</button></div>
    <div class="opts">${Q.opts.map(o=>{let c='';if(Q.picked){if(o.id===x.id)c=' right';else if(o.id===Q.picked)c=' wrong';}
      return `<button class="opt${c}" data-pick="${o.id}" ${Q.picked?'disabled':''}>${esc(o.zh)}</button>`}).join('')}</div>
    ${Q.picked?`<div class="reveal"><div class="en-text">${esc(x.en)}</div><div class="ipa">/${esc(x.ipa)}/</div></div>
      <button class="btn wide primary" id="next">${Q.i+1<Q.items.length?'下一句':'看结果'}</button>`:''}
  </div>`;
}
function renderResult(){
  const n=Q.items.length;
  return `<div class="quiz result"><div class="eyebrow">练习完成</div><div class="big">${Q.right}<small style="font-size:24px"> / ${n}</small></div>
    <p>${Q.right===n?'全部答对，太棒了！':Q.right>=n*0.6?'不错！不会的句子下次会再出现。':'没关系，多听几遍就熟了。'}</p>

}

// ---------- render & events ----------
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  const app=$('#app');
  if(tab==='learn')app.innerHTML=view.name==='scene'?renderScene(view.id):renderHome();
  else if(tab==='practice')app.innerHTML=view.name==='quiz'?renderQuiz():view.name==='result'?renderResult():renderPracticeSetup();
  else app.innerHTML=renderMine();
  const q=$('#q');if(q){q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}};}
}

function showToOther(x){
  const el=$('#show');
  el.innerHTML=`<div class="small">Excuse me —</div><div class="huge">${esc(x.en)}</div><div class="small">${esc(x.zh)}</div>
    <div class="actions" style="justify-content:center"><button class="btn" data-say="${x.id}" style="background:var(--sign-ink);color:var(--sign);border-color:var(--sign-ink)">${PLAY}读给对方听</button></div>
    <div class="hint">点击空白处关闭</div>`;
  el.hidden=false;
}
$('#show').addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){speak(BY_ID[b.dataset.say].en);return;}e.currentTarget.hidden=true;});

document.addEventListener('click',e=>{
  const t=e.target.closest('button,input');if(!t||t.closest('#show'))return;
  const card=t.closest('.card[data-id]');
  if(card&&t.dataset.act){
    const x=BY_ID[card.dataset.id];
    switch(t.dataset.act){
      case 'play':speak(x.en);break;
      case 'slow':speak(x.en,true);break;
      case 'show':showToOther(x);break;
      case 'known':if(S.known[x.id])delete S.known[x.id];else{S.known[x.id]=1;toast('已标记为会说');}save();render();break;
      case 'star':if(S.star[x.id])delete S.star[x.id];else{S.star[x.id]=1;toast('已收藏');}save();render();break;
    }return;
  }
  if(t.dataset.scene){view={name:'scene',id:t.dataset.scene};render();window.scrollTo(0,0);return;}
  if(t.hasAttribute('data-back')){view={name:'home'};render();return;}
  if(t.dataset.practice){P.scope=t.dataset.practice;go('practice');return;}
  if(t.dataset.scope){P.scope=t.dataset.scope;render();return;}
  if(t.dataset.mode){P.mode=t.dataset.mode;render();return;}
  if(t.id==='onlyNew'){P.onlyNew=t.checked;render();return;}
  if(t.id==='start'||t.id==='again'){startQuiz();return;}
  if(t.hasAttribute('data-quit')){Q=null;view={name:'practice'};render();return;}
  if(t.dataset.say){speak(BY_ID[t.dataset.say].en);return;}
  if(t.dataset.sayslow){speak(BY_ID[t.dataset.sayslow].en,true);return;}
  if(t.id==='reveal'){Q.revealed=true;speak(Q.items[Q.i].en);render();return;}
  if(t.dataset.grade!==undefined){const x=Q.items[Q.i];if(t.dataset.grade==='1'){Q.right++;S.known[x.id]=1;}else delete S.known[x.id];save();nextQ();return;}
  if(t.dataset.pick&&!Q.picked){const x=Q.items[Q.i];Q.picked=t.dataset.pick;if(Q.picked===x.id){Q.right++;S.known[x.id]=1;}else{delete S.known[x.id];speak(x.en);}save();render();return;}
  if(t.id==='next'){nextQ();return;}
  if(t.id==='testVoice'){speak('Hello! Welcome to London. Enjoy your trip.');return;}
  if(t.id==='reset'){confirmReset=true;render();return;}
  if(t.id==='resetNo'){confirmReset=false;render();return;}
  if(t.id==='resetYes'){S.known={};S.star={};save();confirmReset=false;render();toast('已清空');return;}
});
function nextQ(){if(Q.i+1<Q.items.length){Q.i++;prepQ();render();}else{view={name:'result'};render();}window.scrollTo(0,0);}
document.addEventListener('change',e=>{
  if(e.target.id==='accent'){S.accent=e.target.value;save();speak('Hello! Nice to meet you.');}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rate'){S.rate=parseFloat(e.target.value);$('#rateV').textContent=S.rate.toFixed(1);save();}
});
render();
</script>
</body>
</html>
