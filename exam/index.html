<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小学英语单元测试卷</title>
<meta name="theme-color" content="#5b8def">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#2d3142;--soft:#7a8096;--line:#dfe5f5;--hd:#5b8def;--ok:#2fbf71;--bad:#ff5d5d;--shadow:0 4px 0 rgba(0,0,0,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:17px}
body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
header .wrap{display:flex;align-items:center;gap:10px;min-height:40px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);font-size:22px;display:grid;place-items:center;color:#fff}
.hero{text-align:center;padding:22px 0 6px}.hero .big{font-size:54px}.hero h2{margin:8px 0 4px;font-size:23px}.hero p{margin:0;color:var(--soft);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.book{border-radius:20px;padding:16px 12px;color:#fff;text-align:left;box-shadow:var(--shadow);min-height:120px;display:flex;flex-direction:column;gap:4px}
.book .ic{font-size:34px}.book b{font-size:20px}.book small{opacity:.92;font-size:13px}
.sec{font-size:15px;color:var(--soft);margin:18px 2px 8px}
.unit{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left}
.unit .no{width:46px;height:46px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.unit .tt{flex:1;min-width:0}.unit .tt b{display:block}.unit .tt span{color:var(--soft);font-size:14px}
.score{font-weight:800;color:var(--hd);white-space:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{background:var(--hd);color:#fff;border-radius:16px;padding:11px 16px;font-weight:700;box-shadow:var(--shadow)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:active,.unit:active,.book:active{transform:translateY(2px);box-shadow:none}
.note{font-size:14px;color:var(--soft);background:#fff;border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.6}
.tkeyopt{display:block;font-size:14px;color:var(--soft);margin:4px 2px 8px}
.foot{text-align:center;color:var(--soft);font-size:12px;margin:24px 0 8px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d3142;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:.92}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* 试卷 */
.paper{background:#fff;border-radius:18px;padding:16px 14px;box-shadow:var(--shadow)}
.phead{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.pt{font-size:20px;font-weight:800}.ps{color:var(--soft);font-size:14px;margin-top:4px}.pinfo{margin-top:8px;font-size:15px}
.tpart{text-align:center;font-weight:800;margin:18px 0 6px;font-size:17px}
.tsec h4{margin:14px 0 8px;font-size:16px;line-height:1.5}.tsec h4 small{font-weight:400;color:var(--soft);font-size:13px}
.tlh{font-size:13px;color:var(--soft);margin:-4px 0 8px}
.ti{padding:8px 6px;border-radius:12px;margin-bottom:4px}
.ti.tok{background:#eafff2}.ti.tbad{background:#fff1f1}
.tq{line-height:1.7;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.br{white-space:nowrap;margin-right:2px}.bf{display:inline-block;min-width:16px;text-align:center;color:var(--hd)}
.tn{font-weight:700;margin-right:2px}
.tqt{flex:1;min-width:60%}
.topts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px 28px}
.topts.col{flex-direction:column}
.topt{background:var(--bg);border:2px solid transparent;border-radius:12px;padding:8px 12px;cursor:pointer;line-height:1.5}
.topt .tl{margin-right:4px}
.topt.on{border-color:var(--hd);background:#e8efff}
.topt.tright{border-color:var(--ok)}
.topts.pic .topt{display:flex;align-items:center;gap:6px}
.tem{font-size:34px;line-height:1.1}
.pat{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:1px}
.tin{font:inherit;font-size:18px;border:0;border-bottom:2px solid var(--ink);width:150px;padding:2px 4px;background:transparent;outline:none}
.tfb{font-size:14px;color:var(--bad);margin:4px 0 0 28px}
.tpass{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;line-height:1.7}
.tpt{font-weight:800;text-align:center;margin-bottom:4px}
.tpl{margin:2px 0}
.tsx{display:inline}
.ten{font-weight:600}
.tzh,.tcn{display:block;color:var(--soft);font-size:14px;font-weight:400}
.wd.open{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;line-height:1.25}
.wd.open::after{content:attr(data-cn);font-size:13px;font-weight:700;color:#e8590c;white-space:nowrap;line-height:1.2}
.wd.wx.open::after{color:#aab;font-weight:400;font-size:11px}
.tsp{font-size:16px;padding:0 4px;vertical-align:baseline}
.tsp.big{font-size:22px;background:var(--bg);border-radius:50%;width:38px;height:38px}
.wd{cursor:pointer;border-radius:5px;padding:0 1px}
.wd.hl,.cz.hl{background:#ffe066;color:#2d3142;box-shadow:0 0 0 2px #ffe066}
.cz.hl{font-weight:700}
.done{text-align:center;padding:20px 0}.done .big{font-size:60px}.done h2{font-size:34px;margin:6px 0}
.pkey{display:none}
body.kb{padding-bottom:55vh}
/* 背单词 */
.qtop{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog{flex:1;height:12px;background:#fff;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--hd);transition:width .3s}
.qbox{background:#fff;border-radius:22px;padding:22px 14px;text-align:center;box-shadow:var(--shadow);margin:10px 0}
.qbox .em{font-size:64px}.qbox .q{font-size:26px;font-weight:800;margin-top:6px}.qbox .hint{color:var(--soft);font-size:14px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border-radius:18px;padding:14px 8px;box-shadow:var(--shadow);font-size:18px;font-weight:700;border:3px solid transparent;min-height:64px}
.opt.right{border-color:var(--ok);background:#eafff2}.opt.wrong{border-color:var(--bad);background:#fff0f0}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.slot{width:38px;height:46px;border-bottom:4px solid var(--line);font-size:26px;font-weight:800;display:grid;place-items:center}.slot.f{border-color:var(--hd)}
.letters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.letter{width:48px;height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:24px;font-weight:800}.letter.used{visibility:hidden}
.unit .sp{flex:none;background:#fff3e6;color:#e8590c;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.tfrom{font-size:12px;color:var(--soft);margin-bottom:2px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;font-size:12pt}
  header,.no-print,.toast,.confetti{display:none!important}
  .wrap{max-width:none;padding:0}
  .paper{box-shadow:none;border-radius:0;padding:0}
  .ti{break-inside:avoid;padding:3px 0;background:none!important}
  .tsec h4{break-after:avoid;font-size:12.5pt}
  .topts{margin:2px 0 4px 24px;gap:4px 22px}
  .topts.col{gap:2px}
  .topt{background:none!important;border:0!important;padding:0}
  .bf,.tfb{visibility:hidden}
  .tzh{display:none!important}
  .tem{font-size:26pt}
  .tin{width:120px;border-bottom:1px solid #000}
  .tpass{background:none;border:1px solid #999}
  .wd.hl,.cz.hl{background:none;box-shadow:none}
  .wd.open{display:inline}.wd.open::after{display:none}
  body.print-key .pkey{display:block;break-before:page;font-size:11.5pt;line-height:1.7}
}
</style>
</head>
<body>
<header><div class="wrap" id="hdw"></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="../kids/data.js"></script>
<script src="../kids/align.js"></script>
<script>
// ---------- 基础 ----------
const KEY='kidsExam.v1';
let S={accent:'en-US',rate:0.85};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=x=>{const[a,b,c]=x.split('|');return{en:a,cn:b,em:c};};
const P=x=>{const[a,b,c]=x.split('|');return{en:a,cn:b,map:c||''};};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
function confetti(){const em=['🎉','⭐','🌟','🎈','✨'];for(let i=0;i<24;i++){const d=document.createElement('div');d.className='confetti';d.textContent=em[i%em.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4000);}}
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){if(!voices.length)loadVoices();const m=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()==='en-us');return m.find(v=>/samantha|google|natural|enhanced|premium/i.test(v.name))||m[0]||voices.find(v=>/^en/i.test(v.lang))||null;}
function speak(text){
  if(!('speechSynthesis' in window)){toast('这个浏览器不能朗读，请用 Safari 或 Chrome 打开');return;}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,'').replace(/_+/g,' blank '));u.lang='en-US';const v=pickVoice();if(v)u.voice=v;u.rate=S.rate;speechSynthesis.speak(u);}catch(e){toast('朗读失败，请检查手机是否静音');}
}
</script>
<script src="gloss.js?v=5"></script>
<script src="exam.js?v=9"></script>
<script src="spell.js?v=1"></script>
<script>
// ---------- 页面 ----------
function header(title,back){$('#hdw').innerHTML=(back?`<button class="back" data-go="${back}" aria-label="返回">‹</button>`:'')+`<h1>${title}</h1>`;}
function go(h){location.hash=h;}
window.addEventListener('hashchange',render);
function best(b,i){return S.tests&&S.tests[b.id+'-'+i];}
function render(){
  try{speechSynthesis.cancel();}catch(e){}
  TEST=null;window.scrollTo(0,0);
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  const b=p[0]==='b'&&BOOKS.find(x=>x.id===p[1]);
  if(p[0]==='wrong'){header('📒 错题本','/');$('#app').innerHTML=renderReview();return;}
  if(b&&p[2]!=null&&b.units[+p[2]]&&p[3]==='spell'){header(`第${CN_NUM[+p[2]]}单元 · 背单词`,`/b/${b.id}`);startSpell(b,+p[2]);return;}
  if(b&&p[2]!=null&&b.units[+p[2]]){
    const i=+p[2];
    header(`第${CN_NUM[i]}单元 · ${esc(b.units[i].t)}`,`/b/${b.id}`);
    $('#app').innerHTML=renderTest(b,i);return;
  }
  if(b){
    header(`${b.icon} ${b.grade}${b.term} 测试卷`,'/');
    $('#app').innerHTML=`<div class="sec">${b.ed} · 选一个单元</div>`+b.units.map((u,i)=>`
      <button class="unit" data-go="/b/${b.id}/${i}"><span class="no" style="background:${b.color}">${CN_NUM[i]}</span>
      <span class="tt"><b>第${CN_NUM[i]}单元测试卷</b><span>Unit ${i+1} ${esc(u.t)} · ${u.c}</span></span>
      <span class="score">${best(b,i)!=null?best(b,i)+' 分':''}</span><span class="sp" data-go="/b/${b.id}/${i}/spell">🔤 背单词</span></button>`).join('');
    return;
  }
  header('📝 小学英语单元测试卷','');
  $('#app').innerHTML=`<div class="hero"><div class="big">📝</div><h2>单元测试卷</h2><p>手机上直接做题 · 也能打印成 A4 试卷</p></div>
  <button class="unit" data-go="/wrong" style="margin-bottom:14px"><span class="no" style="background:#ef6f6c">📒</span><span class="tt"><b>错题本</b><span>${wrongCount()?`有 ${wrongCount()} 道错题要再练`:'还没有错题，交卷后做错的题会收到这里'}</span></span><span class="score">›</span></button>
  <div class="grid">${BOOKS.map(b=>`<button class="book" style="background:${b.color}" data-go="/b/${b.id}"><span class="ic">${b.icon}</span><b>${b.grade}${b.term}</b><small>${b.ed}</small><small>${b.units.length} 套单元卷</small></button>`).join('')}</div>
  <div class="note">每套卷 100 分，有听力和笔试：听音选图、听音选词、听音选句、看图写单词、选出不同类、单项选择、情景交际、阅读判断。<br>做题时点 🔊 读整句，点英文单词读单词，单词下面会显示它的中文。交卷后做错的题会收进「错题本」。<br>打印的试卷最后一页有听力原文和答案，听力部分请家长照着读。</div>
  <div class="foot">题目按人教版课本每个单元的单词和句型编写，不是课本或练习册的原题。<br>学单词、玩游戏请到：<a href="../kids/">小学英语乐园</a></div>`;
}
// 点单词：读这个词，单词变黄，旁边冒出它的中文
// 平板/手机键盘弹出时，把正在填的横线滚到看得见的地方；按回车跳到下一个空
document.addEventListener('focusin',e=>{if(!e.target.classList.contains('tin'))return;document.body.classList.add('kb');setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),350);});
document.addEventListener('focusout',e=>{if(!e.target.classList.contains('tin'))return;setTimeout(()=>{if(!document.activeElement||!document.activeElement.classList.contains('tin'))document.body.classList.remove('kb');},300);});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.classList.contains('tin'))return;e.preventDefault();const all=[...document.querySelectorAll('.tin')];const n=all[all.indexOf(e.target)+1];if(n)n.focus();else e.target.blur();});
// 点过的词，中文一直留在单词下面
document.addEventListener('click',e=>{
  const wd=e.target.closest('.wd');
  if(wd){
    const row=wd.closest('.tsx');const g=wd.dataset.g;
    document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
    let words=[wd];
    if(g!=='-1')words=[...row.querySelectorAll(`.wd[data-g="${g}"]`)];
    words.forEach(x=>x.classList.add('hl'));
    if(wd.dataset.cn)wd.classList.add('open');
    if(!row.dataset.ns)speak(words.map(x=>x.textContent).join(' '));
    return;
  }
  document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
  const t=e.target.closest('[data-go]');if(t){e.stopPropagation();go(t.dataset.go);}
});
render();
</script>
</body>
</html>
