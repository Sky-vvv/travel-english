<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小学英语乐园</title>
<meta name="theme-color" content="#ffcf3f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐣</text></svg>">
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#3b2f2f;--soft:#8a7a70;--line:#f0e2c8;--main:#ff8a5b;--ok:#2fbf71;--bad:#ff5d5d;--shadow:0 4px 0 rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:17px}
body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--hd,#ffcf3f);padding:calc(10px + env(safe-area-inset-top)) 0 10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
header .wrap{display:flex;align-items:center;gap:10px;min-height:40px}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);font-size:22px;display:grid;place-items:center}
.pill{background:rgba(255,255,255,.75);border-radius:20px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.hero{text-align:center;padding:22px 0 8px}
.hero .big{font-size:56px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.hero h2{margin:8px 0 4px;font-size:24px}
.hero p{margin:0;color:var(--soft);font-size:15px}
@keyframes bob{50%{transform:translateY(-8px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.book{border-radius:20px;padding:16px 12px;color:#fff;text-align:left;box-shadow:var(--shadow);min-height:130px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.book .ic{font-size:38px}
.book b{font-size:21px}
.book small{opacity:.92;font-size:13px}
.book .st{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.3);border-radius:12px;padding:2px 8px;font-size:13px}
.sec{font-size:15px;color:var(--soft);margin:18px 2px 8px}
.unit{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);text-align:left;border:2px solid transparent}
.unit .no{width:46px;height:46px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.unit .tt{flex:1;min-width:0}
.unit .tt b{display:block;font-size:17px}
.unit .tt span{color:var(--soft);font-size:14px}
.stars{font-size:15px;letter-spacing:1px;white-space:nowrap}
.tabs{display:flex;gap:6px;background:#fff;border-radius:18px;padding:5px;margin:14px 0;box-shadow:var(--shadow);position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:4}
.tabs button{flex:1;padding:10px 0;border-radius:14px;font-weight:700;font-size:15px;color:var(--soft)}
.tabs button.on{background:var(--hd);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.btn{background:var(--hd);color:#fff;border-radius:16px;padding:11px 16px;font-weight:700;box-shadow:var(--shadow)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn:active,.wcard:active,.unit:active,.book:active,.opt:active{transform:translateY(2px);box-shadow:none}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wcard{background:#fff;border-radius:18px;padding:14px 8px 10px;text-align:center;box-shadow:var(--shadow);position:relative;border:2px solid transparent}
.wcard .em{font-size:42px;line-height:1.1}
.wcard .en{font-size:20px;font-weight:800;margin-top:6px;word-break:break-word}
.wcard .cn{color:var(--soft);font-size:14px;margin-top:2px;min-height:20px}
.wcard .slow{position:absolute;right:6px;top:6px;font-size:18px;opacity:.75;padding:4px}
.wcard.playing{border-color:var(--hd)}
.hidecn .cn,.hidecn .zh{visibility:hidden}
.sent{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow);width:100%;text-align:left;border:2px solid transparent}
.sent .sp{font-size:18px;flex:none;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700}
.sent .tx{flex:1;min-width:0}
.wd{cursor:pointer;border-radius:6px;padding:0 1px}
.wd.hl,.cz.hl{background:#ffe066;color:#3b2f2f;box-shadow:0 0 0 2px #ffe066}
.cz{border-radius:4px}
.cz.hl{font-weight:700}
.sent .en{font-size:18px;font-weight:600;line-height:1.4}
.sent .zh{color:var(--soft);font-size:14px;margin-top:3px}
.sent.playing{border-color:var(--hd);background:#fffbea}
.ptitle{text-align:center;margin:6px 0 2px;font-size:22px}
.psub{text-align:center;color:var(--soft);margin:0 0 12px;font-size:14px}
.note{font-size:13px;color:var(--soft);background:#fff;border-radius:12px;padding:10px 12px;margin-top:14px;line-height:1.5}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:left;width:100%}
.mode .em{font-size:36px}
.mode b{display:block;font-size:18px}
.mode span{color:var(--soft);font-size:14px}
.qtop{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog{flex:1;height:12px;background:#fff;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hd);transition:width .3s}
.qbox{background:#fff;border-radius:22px;padding:22px 14px;text-align:center;box-shadow:var(--shadow);margin:10px 0}
.qbox .em{font-size:64px}
.qbox .q{font-size:26px;font-weight:800;margin-top:6px}
.qbox .hint{color:var(--soft);font-size:14px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border-radius:18px;padding:14px 8px;box-shadow:var(--shadow);font-size:18px;font-weight:700;border:3px solid transparent;min-height:72px}
.opt .em{font-size:34px;display:block}
.opt small{display:block;color:var(--soft);font-weight:500;font-size:14px}
.opt.right{border-color:var(--ok);background:#eafff2}
.opt.wrong{border-color:var(--bad);background:#fff0f0;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}
.slot{width:38px;height:46px;border-bottom:4px solid var(--line);font-size:26px;font-weight:800;display:grid;place-items:center}
.slot.f{border-color:var(--hd)}
.letters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.letter{width:48px;height:52px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:24px;font-weight:800}
.letter.used{visibility:hidden}
.done{text-align:center;padding:24px 0}
.done .big{font-size:70px}
.done .stars{font-size:44px;letter-spacing:6px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3b2f2f;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:.92}
.confetti{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.set{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin:14px 0}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:10px;font-size:15px}
.seg button.on{background:#ffcf3f;font-weight:700}
input[type=range]{flex:1;max-width:180px;accent-color:#ff8a5b}
.foot{text-align:center;color:var(--soft);font-size:12px;margin:24px 0 8px;line-height:1.6}
</style>
</head>
<body>
<header id="hd"><div class="wrap" id="hdw"></div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="align.js"></script>
<script>
// ---------- state ----------
const KEY='kidsEnglish.v1';
let S={stars:{},accent:'en-US',rate:0.85,wrong:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// 错题本：游戏里答错、拼错或点了「看答案」的单词都记下来
S.wrong=S.wrong||{};
function addWrong(w){const k=w.en.toLowerCase();const o=S.wrong[k]||{w:[w.en,w.cn,w.em].join('|'),n:0};o.n++;o.t=Date.now();S.wrong[k]=o;save();}
function wrongList(){return Object.values(S.wrong).sort((a,b)=>b.t-a.t).map(o=>W(o.w));}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W=x=>{const[a,b,c]=x.split('|');return{en:a,cn:b,em:c};};
const P=x=>{const[a,b,c]=x.split('|');return{en:a,cn:b,map:c||''};};
// 句子：英文每个词可点，点了以后英文和对应的中文一起变色
function sentHTML(s,key,label){
  const r=alignSentence(s.en,s.cn,s.map);
  const en=r.enParts.map(p=>p.w?`<span class="wd" data-g="${p.g}">${esc(p.t)}</span>`:esc(p.t)).join('');
  const cn=r.cnParts.map(p=>p.g>=0?`<span class="cz" data-g="${p.g}">${esc(p.t)}</span>`:esc(p.t)).join('');
  return `<div class="sent"><button class="sp" ${key} aria-label="朗读整句">${label}</button><div class="tx"><div class="en">${en}</div><div class="zh">${cn}</div></div></div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800);}
const starStr=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
const unitStars=(b,i)=>S.stars[b+'-'+i]||0;
function bookStars(b){return b.units.reduce((s,_,i)=>s+unitStars(b.id,i),0);}

// ---------- speech ----------
let voices=[],speakToken=0;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){
  if(!voices.length)loadVoices();
  const want=S.accent.toLowerCase();
  const m=voices.filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase()===want);
  const good=m.find(v=>/samantha|daniel|google|natural|enhanced|premium/i.test(v.name));
  return good||m[0]||voices.find(v=>/^en/i.test(v.lang))||null;
}
function stopSpeak(){speakToken++;try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing'));}
function say(text,slow,onend){
  if(!('speechSynthesis' in window)){toast('这个浏览器不能朗读，请用 Safari 或 Chrome 打开');return;}
  try{
    const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,''));
    u.lang=S.accent;const v=pickVoice();if(v)u.voice=v;
    u.rate=slow?0.55:S.rate;
    if(onend){u.onend=onend;u.onerror=onend;}
    speechSynthesis.speak(u);
  }catch(e){toast('朗读失败，请检查手机是否静音');}
}
function speak(text,slow){stopSpeak();say(text,slow);}
// 依次朗读一组，el 列表会依次高亮
function playList(items,els){
  stopSpeak();const tk=speakToken;let i=0;
  const next=()=>{
    if(tk!==speakToken)return;
    els.forEach(e=>e.classList.remove('playing'));
    if(i>=items.length)return;
    const el=els[i];if(el){el.classList.add('playing');el.scrollIntoView({block:'center',behavior:'smooth'});}
    const t=items[i++];
    say(t,false,()=>setTimeout(next,450));
  };
  next();
}

// ---------- little sounds ----------
let actx;
function beep(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+k*.12;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2);});
  }catch(e){}
}
function confetti(){
  const em=['🎉','⭐','🌟','🎈','🍬','✨'];
  for(let i=0;i<26;i++){const d=document.createElement('div');d.className='confetti';d.textContent=em[i%em.length];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200);}
}

// ---------- routing ----------
function go(h){location.hash=h;}
window.addEventListener('hashchange',render);
function header(title,back,right,color){
  document.documentElement.style.setProperty('--hd',color||'#ffcf3f');
  $('#hd').style.background=color||'#ffcf3f';
  $('#hdw').innerHTML=(back?`<button class="back" data-go="${back}" aria-label="返回">‹</button>`:'')+`<h1 style="${color?'color:#fff':''}">${title}</h1>`+(right||'');
}
let unitTab='w',hideCn=false,game=null;
function render(){
  stopSpeak();
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(parts[0]==='wrong'){
    if(parts[1]==='play'&&game&&game.review&&game.qs){header('📒 错题本','/wrong','',"#ef6f6c");return renderGame();}
    return renderWrong();
  }
  if(parts[0]==='b'){
    const b=BOOKS.find(x=>x.id===parts[1]);
    if(!b)return go('/');
    if(parts.length>=3){const i=+parts[2];if(b.units[i]){if(parts[3]!=='play')game=null;return renderUnit(b,i,parts[3]);}}
    return renderBook(b);
  }
  renderHome();
}

// ---------- home ----------
function renderHome(){
  const total=BOOKS.reduce((s,b)=>s+bookStars(b),0);
  header('🐣 小学英语乐园','',`<span class="pill">⭐ ${total}</span>`);
  $('#app').innerHTML=`
  <div class="hero"><div class="big">🐣</div><h2>一起学英语吧！</h2><p>点单词听发音 · 读短文 · 玩游戏拿星星</p></div>
  <button class="unit" data-go="/wrong" style="margin-bottom:14px"><span class="no" style="background:#ef6f6c">📒</span><span class="tt"><b>错题本</b><span>${Object.keys(S.wrong).length?`有 ${Object.keys(S.wrong).length} 个单词要再练`:'还没有错题'}</span></span><span class="stars">›</span></button>
  <div class="grid">${BOOKS.map(b=>`
    <button class="book" style="background:${b.color}" data-go="/b/${b.id}">
      <span class="st">⭐ ${bookStars(b)}/${b.units.length*3}</span>
      <span class="ic">${b.icon}</span><b>${b.grade}${b.term}</b><small>${b.ed}</small><small>${b.units.length} 个单元</small>
    </button>`).join('')}</div>
  <div class="set">
    <div class="set-row"><span>🔊 发音</span><div class="seg"><button data-acc="en-US" class="${S.accent==='en-US'?'on':''}">美式</button><button data-acc="en-GB" class="${S.accent==='en-GB'?'on':''}">英式</button></div></div>
    <div class="set-row"><span>🐢 语速 <b id="rv">${S.rate.toFixed(2)}</b></span><input id="rate" type="range" min="0.5" max="1.1" step="0.05" value="${S.rate}"></div>
    <div class="set-row"><span>没有声音？</span><button class="btn ghost" data-say="Hello! Let's learn English!">试听一下</button></div>
  </div>
  <div class="foot">单元目录按人教版课本编排（三、四年级为 2024 新版 PEP，六年级为 PEP 版）。<br>短文是按每个单元的单词和句型原创的练习短文，不是课本原文。<br>手机静音键打开时可能听不到声音。</div>`;
}

// ---------- book ----------
function renderBook(b){
  header(`${b.icon} ${b.grade}${b.term}`,'/',`<span class="pill">⭐ ${bookStars(b)}</span>`,b.color);
  $('#app').innerHTML=`<div class="sec">${b.ed} · 选一个单元开始</div>`+b.units.map((u,i)=>`
    <button class="unit" data-go="/b/${b.id}/${i}">
      <span class="no" style="background:${b.color}">U${i+1}</span>
      <span class="tt"><b>${esc(u.t)}</b><span>${u.c} · ${u.w.length} 个单词</span></span>
      <span class="stars">${starStr(unitStars(b.id,i))}</span>
    </button>`).join('');
}

// ---------- unit ----------
function renderUnit(b,i,sub){
  const u=b.units[i];
  header(`U${i+1} ${esc(u.t)}`,`/b/${b.id}`,`<span class="pill">${starStr(unitStars(b.id,i))}</span>`,b.color);
  if(sub==='play'&&game)return renderGame();
  const tabs=[['w','📖 单词'],['s','💬 句子'],['p','📜 短文'],['g','🎮 游戏']];
  let html=`<div class="tabs">${tabs.map(([k,t])=>`<button data-tab="${k}" class="${unitTab===k?'on':''}">${t}</button>`).join('')}</div><div id="tabc" class="${hideCn?'hidecn':''}">`;
  if(unitTab==='w'){
    const ws=u.w.map(W);
    html+=`<div class="bar"><button class="btn" data-playall="w">▶️ 全部读一遍</button><button class="btn ghost" data-hidecn>${hideCn?'👀 显示中文':'🙈 遮住中文'}</button></div>
    <div class="words">${ws.map((w,k)=>`<button class="wcard" data-word="${k}"><span class="slow" data-slow="${esc(w.en)}" title="慢速">🐢</span><div class="em">${w.em}</div><div class="en">${esc(w.en)}</div><div class="cn">${esc(w.cn)}</div></button>`).join('')}</div>
    <div class="note">👆 点卡片听发音，点 🐢 听慢速。</div>`;
  }else if(unitTab==='s'){
    const ss=u.s.map(P);
    html+=`<div class="bar"><button class="btn" data-playall="s">▶️ 全部读一遍</button><button class="btn ghost" data-hidecn>${hideCn?'👀 显示中文':'🙈 遮住中文'}</button></div>`+
    ss.map((s,k)=>sentHTML(s,`data-sent="${k}"`,'🔊')).join('')+`<div class="note">👆 点句子里的任意一个英文单词，它和对应的中文会一起变黄色；点 🔊 听整句。</div>`;
  }else if(unitTab==='p'){
    const ps=u.p.s.map(P);
    html+=`<h3 class="ptitle">${esc(u.p.t)}</h3><p class="psub">${esc(u.p.c)}</p>
    <div class="bar"><button class="btn" data-playall="p">▶️ 读整篇</button><button class="btn ghost" data-stop>⏹ 停</button><button class="btn ghost" data-hidecn>${hideCn?'👀 显示中文':'🙈 遮住中文'}</button></div>`+
    ps.map((s,k)=>sentHTML(s,`data-psent="${k}"`,k+1)).join('')+
    `<div class="note">📌 这篇短文是按本单元的单词和句型编写的练习短文，帮助孩子复习，不是课本原文。点句子前面的数字可以单独听这一句；点某个英文单词，它和对应的中文会一起变黄色。</div>`;
  }else{
    html+=`<div class="modes">
      <button class="mode" data-mode="listen"><span class="em">👂</span><span><b>听音选图</b><span>听英语，选出对的图和意思</span></span></button>
      <button class="mode" data-mode="cn"><span class="em">🀄</span><span><b>看中文选英文</b><span>看中文意思，选出英语单词</span></span></button>
      <button class="mode" data-mode="spell"><span class="em">🔤</span><span><b>拼单词</b><span>点字母，拼出听到的单词</span></span></button>
    </div><div class="note">每个游戏 10 道题。答错了要在这一题改对，才能进入下一题。拼单词不会可以点「不会，看答案」，拼错了也会给答案，先照着拼对一遍，再遮住答案默写对才过关。一次就答对 10 题得 ⭐⭐⭐，7 题以上得 ⭐⭐，4 题以上得 ⭐。</div>`;
  }
  $('#app').innerHTML=html+'</div>';
  game={b,i,u};game.mode=null;
}

// ---------- games ----------
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(mode){
  if(game&&game.review)return startReview(mode);
  const {b,i,u}=game;
  let pool=u.w.map(W);
  if(mode==='spell'){pool=pool.filter(w=>/^[a-zA-Z]+$/.test(w.en)&&w.en.length<=9);}
  // 题目不足 10 道时，从同册其他单元补
  let extra=shuffle(b.units.flatMap((x,k)=>k===i?[]:x.w.map(W))).filter(w=>mode!=='spell'||(/^[a-zA-Z]+$/.test(w.en)&&w.en.length<=9));
  let qs=shuffle(pool).slice(0,10);
  while(qs.length<10&&extra.length)qs.push(extra.shift());
  game={...game,mode,qs,k:0,score:0,missed:false,all:u.w.map(W).concat(b.units.flatMap(x=>x.w.map(W)))};
  go(`/b/${b.id}/${i}/play`);
}
function startReview(mode){
  let pool=wrongList();
  if(mode==='spell')pool=pool.filter(w=>/^[a-zA-Z]+$/.test(w.en)&&w.en.length<=9);
  if(!pool.length){toast(mode==='spell'?'错题本里没有能拼的单词，换个游戏吧':'错题本是空的，真棒！');return;}
  const all=pool.concat(BOOKS.flatMap(b=>b.units.flatMap(x=>x.w.map(W))));
  game={review:true,u:{t:'错题本',w:[]},mode,qs:shuffle(pool).slice(0,10),k:0,score:0,missed:false,all};
  go('/wrong/play');
}
function renderWrong(){
  header('📒 错题本','/','',"#ef6f6c");
  const ws=wrongList();
  game={review:true,u:{t:'错题本',w:[]},mode:null};
  if(!ws.length){$('#app').innerHTML=`<div class="done"><div class="big">🎉</div><h2>错题本是空的！</h2><p>玩游戏时答错的单词会自动收到这里，方便再练。</p><div class="bar" style="justify-content:center"><button class="btn" data-go="/">返回首页</button></div></div>`;return;}
  $('#app').innerHTML=`<div class="sec">一共 ${ws.length} 个单词要再练。练习时一次就答对，这个词就从错题本移走。</div>
  <div class="modes">
    <button class="mode" data-mode="listen"><span class="em">👂</span><span><b>听音选图</b><span>听英语，选出对的图和意思</span></span></button>
    <button class="mode" data-mode="cn"><span class="em">🀄</span><span><b>看中文选英文</b><span>看中文意思，选出英语单词</span></span></button>
    <button class="mode" data-mode="spell"><span class="em">🔤</span><span><b>拼单词</b><span>拼对后还要选出中文意思</span></span></button>
  </div>
  <div class="sec" style="margin-top:14px">要再练的单词</div>
  <div class="words">${ws.map(w=>`<div class="wcard" data-say="${esc(w.en)}"><span class="slow" data-wdel="${esc(w.en.toLowerCase())}" title="我会了">✓</span><div class="em">${w.em}</div><div class="en">${esc(w.en)}</div><div class="cn">${esc(w.cn)}</div><div class="cn" style="color:var(--bad);font-size:12px">错了 ${S.wrong[w.en.toLowerCase()].n} 次</div></div>`).join('')}</div>
  <div class="note">👆 点卡片听发音。已经会了，可以点卡片右上角的 ✓ 把它移出错题本。</div>`;
}
function renderGame(){
  const g=game;
  if(g.k>=g.qs.length)return renderDone();
  const q=g.qs[g.k];
  let html=`<div class="qtop"><button class="btn ghost" data-quit>✕</button><div class="prog"><i style="width:${g.k/g.qs.length*100}%"></i></div><b>${g.k+1}/${g.qs.length}</b></div>`;
  if(g.mode==='spell'){
    g.ans='';g.phase='';
    html+=`<div class="qbox"><div class="em">${q.em}</div><div class="q">${esc(q.cn)}</div><div class="hint"></div><div id="reveal"></div><button class="btn" data-hear style="margin-top:10px">🔊 再听一次</button></div>
    <div class="slots">${q.en.split('').map(()=>`<span class="slot"></span>`).join('')}</div>
    <div class="letters" id="letters"></div>
    <div class="bar" style="justify-content:center;margin-top:14px"><button class="btn ghost" data-undo>⌫ 退一格</button><button class="btn ghost" data-showans id="showans">💡 不会，看答案</button></div>`;
  }else{
    const opts=shuffle([q].concat(shuffle(g.all.filter(w=>w.en!==q.en&&w.cn!==q.cn)).filter((w,k,a)=>a.findIndex(x=>x.en===w.en)===k).slice(0,3)));
    g.opts=opts;
    if(g.mode==='listen'){
      html+=`<div class="qbox"><div class="em">🔊</div><button class="btn" data-hear style="margin-top:8px">再听一次</button></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-opt="${k}"><span class="em">${o.em}</span>${esc(o.cn)}</button>`).join('')}</div>`;
    }else{
      html+=`<div class="qbox"><div class="em">${q.em}</div><div class="q">${esc(q.cn)}</div><div class="hint">选出对的英语单词</div></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-opt="${k}">${esc(o.en)}</button>`).join('')}</div>`;
    }
  }
  $('#app').innerHTML=html;
  g.locked=false;
  if(g.mode==='spell')resetSpell();
  if(g.mode!=='cn')setTimeout(()=>speak(q.en),250);
}
function markMiss(){const g=game;if(!g.missed){g.missed=true;addWrong(g.qs[g.k]);}}
// 答错不跳题：留在这一题，直到答对才进入下一题。只有第一次就答对才算分。
function answer(ok,el){
  const g=game;if(g.locked)return;
  const q=g.qs[g.k];
  if(ok){
    g.locked=true;
    if(!g.missed){g.score++;if(g.review){delete S.wrong[q.en.toLowerCase()];save();}}
    beep(true);
    if(el)el.classList.add('right');
    setTimeout(()=>speak(q.en),200);
    setTimeout(()=>{g.k++;g.missed=false;renderGame();},1100);
    return;
  }
  markMiss();beep(false);
  if(el){el.classList.add('wrong');el.disabled=true;}
  toast('不对哦，再想想！');
  if(g.mode==='listen')setTimeout(()=>speak(q.en),500);
}
// 拼单词：清空格子，重新打乱字母
function resetSpell(){
  const g=game,q=g.qs[g.k];
  g.ans='';g.letters=shuffle(q.en.toLowerCase().split(''));
  document.querySelectorAll('.slot').forEach(s=>{s.textContent='';s.classList.remove('f');});
  const box=document.querySelector('.slots');if(box)box.style.color='';
  $('#letters').innerHTML=g.letters.map((l,k)=>`<button class="letter" data-l="${k}">${l}</button>`).join('');
  g.locked=false;
}
function spellHint(html){document.querySelector('.qbox .hint').innerHTML=html||'';}
// 显示答案，让孩子先照着拼一遍（拼错或点“不会，看答案”时）
function showCopy(msg){
  const g=game,q=g.qs[g.k];
  markMiss();g.phase='copy';
  const b=$('#showans');if(b)b.style.display='none';
  spellHint(`<span style="color:var(--bad)">${msg}</span>`);
  $('#reveal').innerHTML=`<div style="margin-top:6px">正确拼法是 <b style="color:var(--ok);font-size:26px;letter-spacing:2px">${esc(q.en)}</b></div>`;
  resetSpell();speak(q.en,true);
}
// 拼对之后：再看一遍这个英文单词，选出它的中文意思，选对才进入下一题
function showMeaning(){
  const g=game,q=g.qs[g.k];g.phase='mean';
  const opts=shuffle([q].concat(shuffle(g.all.filter(w=>w.en!==q.en&&w.cn!==q.cn)).filter((w,k,a)=>a.findIndex(x=>x.cn===w.cn)===k).slice(0,3)));
  g.mopts=opts;
  const box=document.querySelector('.qbox');
  box.innerHTML=`<div class="hint" style="font-size:18px;color:var(--hd);font-weight:700">拼对啦！它是什么意思？</div><div class="q" style="font-size:44px;letter-spacing:2px;margin:6px 0">${esc(q.en)}</div><button class="btn" data-hear>🔊 再听一次</button>`;
  document.querySelector('.slots').remove();$('#letters').remove();
  const bar=document.querySelector('#showans');if(bar)bar.parentNode.remove();
  box.insertAdjacentHTML('afterend',`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-mopt="${k}">${esc(o.cn)}</button>`).join('')}</div>`);
  g.locked=false;
}
function renderDone(){
  const g=game,n=g.score;
  if(g.review){
    const left=Object.keys(S.wrong).length;
    $('#app').innerHTML=`<div class="done"><div class="big">${left?'💪':'🏆'}</div><h2>${left?'练完一轮啦！':'错题全部消灭！'}</h2><p>这一轮一次就答对 ${n} / ${g.qs.length} 个，已移出错题本。${left?`还剩 ${left} 个。`:''}</p>
    <div class="bar" style="justify-content:center">${left?`<button class="btn" data-mode="${g.mode}">🔁 再练一轮</button>`:''}<button class="btn ghost" data-go="/wrong">返回错题本</button></div></div>`;
    if(!left){confetti();speak('Excellent!');}
    game={review:true,u:g.u,mode:null};return;
  }
  const st=n>=10?3:n>=7?2:n>=4?1:0;
  const key=g.b.id+'-'+g.i;
  const better=st>(S.stars[key]||0);
  if(better){S.stars[key]=st;save();}
  header(`U${g.i+1} ${esc(g.u.t)}`,`/b/${g.b.id}/${g.i}`,`<span class="pill">${starStr(unitStars(g.b.id,g.i))}</span>`,g.b.color);
  const msg=st===3?'太棒了！全对！':st===2?'真厉害！':st===1?'不错哦，再加油！':'别灰心，再试一次！';
  $('#app').innerHTML=`<div class="done"><div class="big">${st===3?'🏆':st>=1?'🎉':'💪'}</div><h2>${msg}</h2><div class="stars">${starStr(st)}</div><p>一次就答对 ${n} / ${g.qs.length} 题${better?'，获得新星星！':''}</p>
  <div class="bar" style="justify-content:center"><button class="btn" data-mode="${g.mode}">🔁 再玩一次</button><button class="btn ghost" data-go="/b/${g.b.id}/${g.i}">返回单元</button></div></div>`;
  if(st>=2){confetti();speak(st===3?'Excellent!':'Great job!');}
  game={b:g.b,i:g.i,u:g.u,mode:null};
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const wd=e.target.closest('.wd');
  if(wd){
    const row=wd.closest('.sent');const g=wd.dataset.g;
    row.parentNode.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
    let words=[wd];
    if(g!=='-1'){words=[...row.querySelectorAll(`.wd[data-g="${g}"]`)];row.querySelectorAll(`.cz[data-g="${g}"]`).forEach(x=>x.classList.add('hl'));}
    words.forEach(x=>x.classList.add('hl'));
    speak(words.map(x=>x.textContent).join(' '));
    return;
  }
  const t=e.target.closest('button,[data-slow],[data-wdel],[data-say]');if(!t)return;
  const d=t.dataset;
  if(d.wdel!==undefined){e.stopPropagation();delete S.wrong[d.wdel];save();toast('好的，已移出错题本');renderWrong();return;}
  if(d.slow!==undefined){e.stopPropagation();speak(d.slow,true);return;}
  if(d.go!==undefined){if(d.go===location.hash.replace(/^#/,''))render();else go(d.go);return;}
  if(d.acc){S.accent=d.acc;save();renderHome();speak('Hello!');return;}
  if(d.say){speak(d.say);return;}
  if(d.tab){unitTab=d.tab;render();return;}
  if(d.hidecn!==undefined){hideCn=!hideCn;$('#tabc').classList.toggle('hidecn',hideCn);t.textContent=hideCn?'👀 显示中文':'🙈 遮住中文';return;}
  if(d.stop!==undefined){stopSpeak();return;}
  const u=game&&game.u;
  if(d.word!==undefined){const w=W(u.w[+d.word]);speak(w.en);return;}
  if(d.sent!==undefined){speak(P(u.s[+d.sent]).en);return;}
  if(d.psent!==undefined){speak(P(u.p.s[+d.psent]).en);return;}
  if(d.playall){
    const list=d.playall==='w'?u.w.map(x=>W(x).en):d.playall==='s'?u.s.map(x=>P(x).en):[u.p.t].concat(u.p.s.map(x=>P(x).en));
    const els=[...document.querySelectorAll(d.playall==='w'?'.wcard':'.sent')];
    playList(list,d.playall==='p'?[null].concat(els):els);return;
  }
  if(d.mode){startGame(d.mode);return;}
  if(d.quit!==undefined){stopSpeak();go(game.review?'/wrong':`/b/${game.b.id}/${game.i}`);return;}
  if(d.hear!==undefined){speak(game.qs[game.k].en,true);return;}
  if(d.mopt!==undefined){const g=game;if(g.locked)return;const ok=g.mopts[+d.mopt]===g.qs[g.k];
    if(!ok){markMiss();beep(false);t.classList.add('wrong');t.disabled=true;toast('不对哦，再想想！');speak(g.qs[g.k].en);return;}
    answer(true,t);return;}
  if(d.opt!==undefined){const g=game;answer(g.opts[+d.opt]===g.qs[g.k],t);return;}
  if(d.l!==undefined){
    const g=game;if(g.locked)return;
    g.ans+=g.letters[+d.l];g.used=(g.used||[]);t.classList.add('used');t.dataset.used=1;
    const slots=document.querySelectorAll('.slot');slots[g.ans.length-1].textContent=g.letters[+d.l];slots[g.ans.length-1].classList.add('f');
    const target=g.qs[g.k].en.toLowerCase();
    if(g.ans.length===target.length){
      const ok=g.ans===target;
      const box=document.querySelector('.slots');
      box.style.color=ok?'var(--ok)':'var(--bad)';
      const q=g.qs[g.k];
      // 拼错一次就给答案 → 照着答案拼对一遍 → 遮住答案默写 → 默写对了才过关（默写错了重新来）
      if(ok&&g.phase==='copy'){
        g.locked=true;g.phase='dict';beep(true);
        setTimeout(()=>{
          $('#reveal').innerHTML='';
          spellHint(`<b style="color:var(--hd)">✍️ 默写「${esc(q.cn)}」：答案遮住了，自己拼出来，拼对才过关</b>`);
          resetSpell();speak(q.en);
        },900);
      }else if(ok){
        g.locked=true;beep(true);setTimeout(()=>speak(q.en),200);
        setTimeout(showMeaning,1000);
      }else{
        answer(false,null);
        g.locked=true;g.phase='copy';
        setTimeout(()=>showCopy('拼错了，先照着下面的答案拼一遍'),900);
      }
    }
    return;
  }
  if(d.showans!==undefined){
    const g=game;if(g.locked||g.phase)return;
    showCopy('先照着下面的答案拼一遍，然后再默写');
    return;
  }
  if(d.undo!==undefined){
    const g=game;if(g.locked||!g.ans)return;
    const last=g.ans.slice(-1);g.ans=g.ans.slice(0,-1);
    const btn=[...document.querySelectorAll('.letter.used')].reverse().find(x=>x.textContent===last);if(btn)btn.classList.remove('used');
    const slots=document.querySelectorAll('.slot');slots[g.ans.length].textContent='';slots[g.ans.length].classList.remove('f');
    return;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='rate'){S.rate=parseFloat(e.target.value);$('#rv').textContent=S.rate.toFixed(2);save();}});
document.addEventListener('change',e=>{if(e.target.id==='rate')speak('Good morning!');});
render();
</script>
</body>
</html>
